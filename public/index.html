<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>links</title>
<meta name="theme-color" content="#0969da">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>

<main class="wrap">

  <header class="top">
    <span class="brand">
      <img src="/favicon.svg" width="22" height="22" alt="">
      links
    </span>
    <label class="pwbox" title="Saved in this browser only">
      <span class="sr">Password</span>
      <input id="pw" type="password" placeholder="password" autocomplete="current-password">
    </label>
  </header>

  <section class="add">
    <div class="row">
      <input id="url" type="url" inputmode="url" placeholder="Paste a link" autocomplete="off" autofocus>
      <button id="check" class="primary">Check</button>
    </div>
    <label id="manualField" class="field" hidden>
      This page has no description. Write one line
      <input id="manual" placeholder="one plain line">
    </label>
  </section>

  <pre id="status" aria-live="polite"></pre>

  <section id="review" class="card" hidden>
    <div class="grid">
      <label class="field">Section <select id="section"></select></label>
      <label class="field">Or a new section <input id="newSection" placeholder="type a name"></label>
    </div>
    <label class="field">Link <input id="label" readonly></label>
    <label class="field">Description <input id="desc"></label>
    <div class="row quiet">
      <button id="retry" class="link">Rewrite description</button>
      <button id="retrySection" class="link">Choose section again</button>
    </div>
    <pre id="bullet" class="code"></pre>
    <pre id="diff" class="code"></pre>
    <div class="row actions">
      <button id="pr" class="primary">Create pull request</button>
      <button id="cancel">Cancel</button>
    </div>
  </section>

  <details class="list" open>
    <summary>Current list</summary>
    <div class="list-body">
      <pre id="list" class="code">Loading the list...</pre>
      <button id="reload" class="small">Reload</button>
    </div>
  </details>

</main>

</body>
</html>
