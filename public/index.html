<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>links</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <span class="brand">links</span>
    <span class="tagline">repos worth finding again</span>
  </div>
</header>

<main class="wrap">

  <section class="card">
    <h2>add link</h2>
    <div class="row">
      <input id="url" placeholder="https://github.com/owner/repo or any url">
      <button id="check" class="primary">check</button>
    </div>
    <div class="grid">
      <label class="field">password <input id="pw" type="password"></label>
      <label class="field">description (only if the page has none) <input id="manual"></label>
    </div>
  </section>

  <pre id="status"></pre>

  <section id="review" class="card" hidden>
    <h2>review</h2>
    <div class="grid">
      <label class="field">section <select id="section"></select></label>
      <label class="field">or new section <input id="newSection"></label>
    </div>
    <label class="field">link <input id="label" readonly></label>
    <label class="field">description <input id="desc"></label>
    <div class="row">
      <button id="retry">retry description</button>
      <button id="retrySection">retry section</button>
    </div>
    <pre id="bullet" class="code"></pre>
    <pre id="diff" class="code"></pre>
    <div class="row actions">
      <button id="pr" class="primary">create pull request</button>
      <button id="cancel">cancel</button>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>list</h2>
      <button id="reload" class="small">reload</button>
    </div>
    <pre id="list" class="code"></pre>
  </section>

</main>

</body>
</html>
